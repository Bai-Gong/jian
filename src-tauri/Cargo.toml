[package]
name = "jian"
version = "0.1.0"
description = "百工·剪 — 视频剪辑工具"
authors = ["guyuemochen"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may necessary to make the lib name unique and wouldn't conflict with the bin name.
# This is only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：启用 tauri.conf.json 的 assetProtocol（媒体文件 convertFileSrc 主路径）所必需，
# 缺失时 tauri-build 校验失败（zhi 仓库 cargo check 实测）。
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
# 命令返回结构与 ffprobe JSON 解析用（M1 施工契约 §1）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 双引擎回退原因日志（ye 失败→ffprobe 时不静默）；运行期由 tauri-plugin-log 落地
log = "0.4"
# 百工·冶（ye）：媒体编解码/处理基础库，git 依赖钉 rev。
# feature 勾选按 ye 的 feature 设计（crates/ye/Cargo.toml）：
# - mp4：MP4 容器解封装/封装（ye-container-mp4，progressive 与 fMP4，
#   含 ContainerRegistry trait 接线与 register_mp4 注册）——probe 双引擎
#   的 MP4 优先路径所需；
# - h264：H.264 解码主链（ye-codec-h264，AVCC/Annex B → yuv420p）——
#   frame.rs 抽帧主链的解码引擎；
# - aac：AAC-LC 解码主链（ye-codec-aac，ADTS/LOAS/esds → packed f32）——
#   waveform.rs 波形峰值的解码引擎；
# - png：PNG 编码（ye-png，RGBA8 → PNG，零第三方依赖）——抽帧出图格式；
# - codec-stubs / filter-stubs 是 M2+ 接口桩聚合入口，产品路径不依赖，不勾。
ye = { git = "https://github.com/Bai-Gong/ye.git", rev = "d77df7478b97c3550d1546b6627ab8b40f7e7dd1", features = ["mp4", "h264", "aac", "png"] }

# 过渡（勿删上面 git 声明）：钉的 rev d77df74 只推到了 mp4/h264/aac——
# 像素核（ye-filter/src/video）、ye-png crate 与门面 png feature 尚未
# 推送远端，只存在于本机 ye 仓库工作区（并行阶段在施）。抽帧主链
# （yuv→rgba 像素核 + ye-png 出图）离不开这三件，按预案以 [patch]
# 本地路径过渡：git 声明仍是登记事实源，ye 推送 png feature 后删本
# 节并重生成 Cargo.lock 即回到纯 git 依赖。E2E 对拍（ffmpeg oracle）
# 在 jian 侧守住过渡期质量。
[patch."https://github.com/Bai-Gong/ye.git"]
ye = { path = "../../ye/crates/ye" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 本机 Kaspersky 会拦截默认参数编译出的 tauri-plugin-dialog 构建脚本二进制（os error 32，
# 按内容缓存的判定，确定性构建导致每次必中）。改 build-override 参数即改变二进制内容，
# 实测绕开判定（2026-10-19）。若再被盯上，微调本节参数即可。
[profile.dev.build-override]
opt-level = 1
debug = false
