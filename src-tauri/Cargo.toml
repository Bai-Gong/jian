[package]
name = "jian"
version = "0.1.0"
description = "百工·剪 — 视频剪辑工具"
authors = ["guyuemochen"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may necessary to make the lib name unique and wouldn't conflict with the bin name.
# This is only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：启用 tauri.conf.json 的 assetProtocol（媒体文件 convertFileSrc 主路径）所必需，
# 缺失时 tauri-build 校验失败（zhi 仓库 cargo check 实测）。
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
# 命令返回结构与 ffprobe JSON 解析用（M1 施工契约 §1）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ye 进程内媒体引擎（ye 接线轨）：
# 路径依赖指到门面包本体（../../ye 是虚拟 workspace 清单，不可直接依赖）；
# CI 上由 workflow 检出 Bai-Gong/ye 到兄弟目录 ../ye（与 fang alias 联调同一套路）。
# feature 面比 duan（mp4+h264）多开两件：aac——剪辑时间线音频轨解码/重编码；
# png——抽帧缩略图经 ye-png 出口（encode-only，ye 侧为此设计的消费方）。
ye = { path = "../../ye/crates/ye", default-features = false, features = ["mp4", "h264", "aac", "png"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 本机 Kaspersky 会拦截默认参数编译出的 tauri-plugin-dialog 构建脚本二进制（os error 32，
# 按内容缓存的判定，确定性构建导致每次必中）。改 build-override 参数即改变二进制内容，
# 实测绕开判定（2026-10-19）。若再被盯上，微调本节参数即可。
[profile.dev.build-override]
opt-level = 1
debug = false
